<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A responsive student management dashboard for managing student records."
    />
    <meta name="theme-color" content="#10243a" />
    <title>Student Hub | Student Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      fetch("./src/app.js")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Unable to load the application (${response.status}).`);
          }
          return response.text();
        })
        .then((source) => {
          const compiled = Babel.transform(source, {
            plugins: [["transform-react-jsx", { runtime: "classic" }]],
          }).code;
          const script = document.createElement("script");
          script.textContent = compiled;
          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error("Unable to start Student Hub:", error);
          document.getElementById("root").innerHTML =
            "<p class='startup-error'>Student Hub could not start. Check your internet connection and reload the page.</p>";
        });
    </script>
  </body>
</html>
